[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phumphuridon", email = "phumphuridon.wongchan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.80",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"
aws-setup = "backend.aws_setup:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,s3]>=1.43.118",
    "httpx2>=2.16.0",
    "moto[dynamodb,s3,server]>=5.2.4",
    "pytest>=9.1.1",
]
